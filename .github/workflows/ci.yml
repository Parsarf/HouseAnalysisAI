name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acq
          POSTGRES_USER: acq
          POSTGRES_PASSWORD: acq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acq -d acq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
        env:
          ACQ_DATABASE_URL: postgresql+psycopg://acq:acq@localhost:5432/acq
      - name: Check Alembic metadata drift
        run: alembic check
        env:
          ACQ_DATABASE_URL: postgresql+psycopg://acq:acq@localhost:5432/acq
      - working-directory: web
        run: npm ci && npm run build
      - run: python -m pytest -m "not integration"
      - run: python -m ruff check .
      - run: python -m mypy api analyst auth calibration changes chat classification common contracts db exports extraction finance flags identity ingestion jobs normalization ops outreach pipeline report_analysis scoring strategies
      - run: lint-imports
