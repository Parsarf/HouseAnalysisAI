[project]
name = "acq"
version = "0.1.0"
description = "Property acquisition analysis platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.1", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires Postgres and supplied product fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = ["api", "analyst", "auth", "calibration", "changes", "classification", "common", "contracts", "db", "exports", "extraction", "finance", "flags", "identity", "ingestion", "jobs", "normalization", "ops", "pipeline", "scoring", "strategies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
