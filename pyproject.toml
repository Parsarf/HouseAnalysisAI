[project]
name = "acq"
version = "0.1.0"
description = "Property acquisition analysis platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "uvicorn[standard]>=0.30,<1",
  "weasyprint>=62,<70",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.1", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires Postgres and supplied product fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI dependency/default markers are intentionally declared in signatures;
# contract re-exports are the public ``contracts`` API, not dead imports.
[tool.ruff.lint.per-file-ignores]
"api/*.py" = ["B008", "BLE001"]
"auth/dependencies.py" = ["B008"]
"auth/service.py" = ["BLE001"]
"contracts/__init__.py" = ["F401"]
"extraction/*.py" = ["BLE001", "DTZ011"]
"fixtures/generate_goldens.py" = ["FURB157"]
"identity/service.py" = ["BLE001"]
"jobs/queue.py" = ["BLE001"]
"normalization/resolver.py" = ["BLE001", "DTZ011"]
"scoring/engine.py" = ["DTZ011", "FURB157"]
"tests/*.py" = ["B008", "B017", "FURB157", "PLW1510", "TRY004"]
"tests/test_golden_fixtures.py" = ["BLE001", "S110"]
"tests/test_pipeline.py" = ["RUF012"]

[tool.setuptools]
packages = ["api", "analyst", "auth", "calibration", "changes", "classification", "common", "contracts", "db", "exports", "extraction", "finance", "flags", "identity", "ingestion", "jobs", "normalization", "ops", "pipeline", "report_analysis", "scoring", "strategies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
