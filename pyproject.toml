[project]
name = "acq"
version = "0.1.0"
description = "Property acquisition analysis platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
