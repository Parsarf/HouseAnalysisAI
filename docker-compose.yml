services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: acq
      POSTGRES_USER: acq
      POSTGRES_PASSWORD: acq
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acq -d acq"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      ACQ_DATABASE_URL: postgresql+psycopg://acq:acq@db:5432/acq
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./documents:/app/documents"]

volumes:
  pgdata:
